# Publishes a new DotAnalyst-Setup.exe; the last release's notes record the parser and app commits it was built from.
# Every hour: when odota/parser (which OpenDota updates for each Dota patch) has a new commit. Run by hand
# (Actions -> Release -> Run workflow): when the parser or this repo has one, so pushed changes ship only then.
# The installed program looks for a newer release at every start and installs it when its window is closed
# (dotanalyst/update.py).
name: Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last release?
        id: check
        run: |
          $parser = ((git ls-remote https://github.com/odota/parser.git refs/heads/master) -split '\s')[0]
          $last = (gh release view --json body -q .body) -join "`n"  # empty when there is no release yet
          $app = $env:GITHUB_EVENT_NAME -eq "schedule" -or $last -like "*app $env:GITHUB_SHA*"  # schedule: parser only
          $new = -not ($last -like "*parser $parser*" -and $app)
          Write-Host "parser $parser, app $env:GITHUB_SHA, new: $new"
          "new=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0  # gh fails when there is no release yet, which is no reason to stop

      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.new == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true'
        with:
          node-version: 22

      - name: Tests
        if: steps.check.outputs.new == 'true'
        run: uv run pytest -q

      - name: Build the setup
        if: steps.check.outputs.new == 'true'
        run: |
          choco install innosetup -y --no-progress
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -Version $env:VERSION
          if ($LASTEXITCODE) { exit 1 }

      - name: Parse a replay with the new parser
        id: smoke
        if: steps.check.outputs.new == 'true'
        run: |
          uv run python packaging/smoke_parser.py
          if ($LASTEXITCODE -eq 2) {  # OpenDota gave no replay: no reason to hold the release back
            "::warning::Not checked with a replay: OpenDota gave none"
            "unchecked=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Publish
        if: steps.check.outputs.new == 'true'
        run: |
          $setup = "build\installer\DotAnalyst-Setup.exe"
          "$((Get-FileHash $setup).Hash.ToLower())  DotAnalyst-Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          $notes = "parser $(Get-Content build\parser\COMMIT)`napp $env:GITHUB_SHA"
          if ("${{ steps.smoke.outputs.unchecked }}") { $notes += "`n`nThe parser was not checked with a replay: OpenDota gave none." }
          gh release create "v$env:VERSION" $setup "$setup.sha256" --target $env:GITHUB_SHA --title "DotAnalyst $env:VERSION" --notes $notes
